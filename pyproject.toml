[project]
name = "bookly-agent"
version = "0.1.0"
description = "Bookly customer support agent: the LLM decides what the customer means, code decides what the customer gets."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
